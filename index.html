<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lex ABNT - Edição Local v26</title>
    
    <!-- Bibliotecas via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background-color: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }

        @media print {
            @page { size: A4; margin: 0; }
            html, body { background: white !important; height: auto !important; overflow: visible !important; }
            #root { display: none !important; }
            #print-container { display: block !important; width: 210mm !important; margin: 0 !important; background: white !important; }
            
            .abnt-page-print { 
                display: flex !important;
                flex-direction: column;
                width: 210mm !important;
                height: 297mm !important;
                padding: 3cm 2cm 2cm 3cm !important;
                box-sizing: border-box !important;
                background: white !important;
                position: relative !important;
                page-break-after: always !important;
                break-after: page !important;
                color: black !important;
                overflow: hidden !important;
            }

            /* Remove a quebra de página na última folha para evitar a página em branco detectada na v25 */
            #print-container > div:last-child .abnt-page-print {
                page-break-after: avoid !important;
                break-after: avoid !important;
            }
        }
        
        .abnt-page-screen {
            width: 21cm;
            min-height: 29.7cm;
            padding: 3cm 2cm 2cm 3cm;
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin: 20px auto;
            position: relative;
            box-sizing: border-box;
            color: black;
            display: flex;
            flex-direction: column;
        }

        .input-field {
            @apply w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 font-medium focus:ring-2 focus:ring-blue-500 outline-none transition-all mb-4;
        }
        
        .field-label {
            @apply text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block ml-1;
        }

        .btn-ghost-red {
            @apply p-2 text-slate-400 hover:text-red-500 transition-colors;
        }
    </style>
</head>
<body>
    <div id="print-container" style="display: none;"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const INITIAL_SECTIONS = [
            { 
                id: 'sec_0', 
                title: 'Capa', 
                type: 'cover', 
                data: {
                    university: 'UNIVERSIDADE ANHANGUERA',
                    faculty: 'FACULDADE DE DIREITO',
                    authors: [{ name: 'RENATA BISPO CAMBUI', ra: '123456789' }],
                    title: 'PROJETO DE EXTENSÃO: INIMPUTABILIDADE PENAL E SAÚDE MENTAL',
                    city: 'São Paulo',
                    year: '2026'
                },
                content: ''
            },
            { 
                id: 'sec_1', 
                title: 'Folha de Rosto', 
                type: 'title_page', 
                data: {
                    description: 'Monografia apresentada à Faculdade de Direito como requisito para obtenção do grau de Bacharel em Direito.',
                    advisor: 'Orientador: Prof. Ms. Hamilton Gonçalves Ferraz'
                },
                content: ''
            },
            { id: 'sec_2', title: 'Sumário', content: 'INTRODUÇÃO\n1. DESENVOLVIMENTO\nCONCLUSÃO\nREFERÊNCIAS', type: 'pre-textual' },
            { id: 'sec_3', title: 'Introdução', content: 'Inicie o seu texto aqui. A numeração deverá aparecer nesta página pela primeira vez.', type: 'textual' },
            { id: 'sec_4', title: 'Desenvolvimento', content: 'Conteúdo do trabalho...', type: 'textual' },
            { id: 'sec_5', title: 'Conclusão', content: 'Considerações finais...', type: 'textual' },
            { id: 'sec_6', title: 'Referências Bibliográficas', content: 'AMARANTE, Paulo. Loucos pela Vida. Rio de Janeiro: FIOCRUZ, 2013.', type: 'references' },
        ];

        function App() {
            const storageKey = 'lex_abnt_local_v26';
            const savedData = localStorage.getItem(storageKey);
            const [sections, setSections] = useState(savedData ? JSON.parse(savedData) : INITIAL_SECTIONS);
            const [activeSectionId, setActiveSectionId] = useState(sections[0].id);
            const [viewMode, setViewMode] = useState('edit');
            const [syncStatus, setSyncStatus] = useState('synced');
            const [fontFamily, setFontFamily] = useState('Arial');
            const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);
            
            const activeSection = sections.find(s => s.id === activeSectionId);
            const [localText, setLocalText] = useState(activeSection?.content || '');
            const isTypingRef = useRef(false);

            useEffect(() => { if (window.lucide) lucide.createIcons(); });

            useEffect(() => {
                if (!isTypingRef.current) {
                    setLocalText(activeSection?.content || '');
                }
            }, [activeSectionId]);

            const saveToLocal = (updated) => {
                setSections(updated);
                localStorage.setItem(storageKey, JSON.stringify(updated));
            };

            const handleDataChange = (field, value) => {
                const updated = sections.map(s => {
                    if (s.id === activeSectionId) {
                        return { ...s, data: { ...s.data, [field]: value } };
                    }
                    return s;
                });
                saveToLocal(updated);
                setSyncStatus('synced');
            };

            const handleAuthorUpdate = (index, field, value) => {
                const updatedAuthors = [...activeSection.data.authors];
                updatedAuthors[index][field] = value;
                handleDataChange('authors', updatedAuthors);
            };

            const addAuthor = () => {
                const updatedAuthors = [...activeSection.data.authors, { name: '', ra: '' }];
                handleDataChange('authors', updatedAuthors);
            };

            const removeAuthor = (index) => {
                if (activeSection.data.authors.length <= 1) return;
                const updatedAuthors = activeSection.data.authors.filter((_, i) => i !== index);
                handleDataChange('authors', updatedAuthors);
            };

            useEffect(() => {
                if (!isTypingRef.current || activeSection.type === 'cover' || activeSection.type === 'title_page') return;
                setSyncStatus('syncing');
                const timer = setTimeout(() => {
                    const updated = sections.map(s => s.id === activeSectionId ? { ...s, content: localText } : s);
                    saveToLocal(updated);
                    setSyncStatus('synced');
                    isTypingRef.current = false;
                }, 500);
                return () => clearTimeout(timer);
            }, [localText]);

            // MOTOR DE PAGINAÇÃO V26 - RIGOR ABNT
            const allPagesData = (() => {
                let globalCounter = 0; 
                let results = [];
                const titlePageIndex = sections.findIndex(s => s.type === 'title_page');
                const introIndex = sections.findIndex(s => s.title.toLowerCase().includes('introdução'));

                sections.forEach((sec, idx) => {
                    const text = (sec.id === activeSectionId) ? localText : (sec.content || '');
                    
                    // ABNT: Capa (idx 0) não conta. Folha de Rosto (idx 1) é a página 1.
                    if (idx >= titlePageIndex) {
                        globalCounter++;
                    }

                    if (sec.type === 'cover' || sec.type === 'title_page') {
                        results.push({ 
                            ...sec, 
                            pageNumber: globalCounter, 
                            showNumber: false, // Nunca mostra número na Folha de Rosto
                            isFirst: true,
                            content: text 
                        });
                    } else {
                        const charsPerPage = 2100;
                        const pagesCount = Math.max(1, Math.ceil(text.length / charsPerPage));
                        
                        for (let p = 0; p < pagesCount; p++) {
                            results.push({
                                ...sec,
                                id: `${sec.id}-${p}`,
                                sectionId: sec.id,
                                content: text.substring(p * charsPerPage, (p + 1) * charsPerPage),
                                pageNumber: globalCounter,
                                // MOSTRA NÚMERO: Apenas se for a Introdução ou posterior
                                showNumber: idx >= introIndex,
                                isFirst: p === 0
                            });
                            
                            // Incrementa se houver páginas extras dentro da mesma secção
                            if (p < pagesCount - 1 && idx >= titlePageIndex) {
                                globalCounter++;
                            }
                        }
                    }
                });
                return results;
            })();

            const PageRenderer = ({ page, isPrint = false }) => {
                const style = { fontFamily: fontFamily === 'Arial' ? 'Arial, sans-serif' : '"Times New Roman", serif', fontSize: '12pt', lineHeight: '1.5' };
                
                if (page.type === 'cover') {
                    return (
                        <div className={isPrint ? 'abnt-page-print' : 'abnt-page-screen'} style={style}>
                            <div className="flex flex-col h-full text-center uppercase font-bold justify-between py-2">
                                <div className="space-y-6">
                                    <div className="whitespace-pre-line leading-tight">
                                        {page.data.university}<br/>{page.data.faculty}
                                    </div>
                                    <div className="mt-12 space-y-4">
                                        {page.data.authors.map((auth, idx) => (
                                            <div key={idx}>
                                                {auth.name || "NOME DO ALUNO"}
                                                <div className="text-[10pt] font-normal normal-case mt-0.5">RA: {auth.ra || "000000"}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="flex-1 flex flex-col justify-center">
                                    <div className="text-xl px-4 whitespace-pre-line leading-tight">{page.data.title}</div>
                                </div>
                                <div className="mt-auto">
                                    {page.data.city}<br/>{page.data.year}
                                </div>
                            </div>
                        </div>
                    );
                }

                if (page.type === 'title_page') {
                    const coverData = sections.find(s => s.type === 'cover').data;
                    return (
                        <div className={isPrint ? 'abnt-page-print' : 'abnt-page-screen'} style={style}>
                            <div className="flex flex-col h-full text-center uppercase font-bold justify-between py-2">
                                <div className="mt-6 space-y-3">
                                    {coverData.authors.map((auth, idx) => (
                                        <div key={idx}>
                                            {auth.name}
                                            <div className="text-[10pt] font-normal normal-case mt-0.5">RA: {auth.ra}</div>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex-1 flex flex-col justify-center">
                                    <div className="text-xl px-4 whitespace-pre-line leading-tight mb-10">{coverData.title}</div>
                                    <div className="mt-6 text-justify lowercase font-normal normal-case text-[10pt] leading-relaxed" style={{ marginLeft: '45%', textTransform: 'none' }}>
                                        {page.data.description}
                                        <div className="mt-6 font-bold uppercase">{page.data.advisor}</div>
                                    </div>
                                </div>
                                <div className="mt-auto">
                                    {coverData.city}<br/>{coverData.year}
                                </div>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className={isPrint ? 'abnt-page-print' : 'abnt-page-screen'} style={style}>
                        {page.showNumber && <div className="absolute top-[2cm] right-[2cm] font-normal text-sm">{page.pageNumber}</div>}
                        <div className="w-full">
                            {page.isFirst && <h2 className="text-center font-bold uppercase mb-12">{page.title}</h2>}
                            <div className="whitespace-pre-wrap text-justify">
                                {page.content.split('\n').map((l, i) => <p key={i} className="mb-4" style={{ textIndent: (page.type === 'references' || l.trim() === "") ? '0' : '1.25cm' }}>{l}</p>)}
                            </div>
                        </div>
                    </div>
                );
            };

            const handleExportPdf = (all) => {
                setIsGeneratingPdf(true);
                const portal = document.getElementById('print-container');
                portal.innerHTML = '';
                const pages = all ? allPagesData : allPagesData.filter(p => p.id === activeSectionId || p.sectionId === activeSectionId);
                
                pages.forEach(p => {
                    const container = document.createElement('div');
                    portal.appendChild(container);
                    ReactDOM.createRoot(container).render(<PageRenderer page={p} isPrint={true} />);
                });

                setTimeout(() => { 
                    setIsGeneratingPdf(false); 
                    window.print(); 
                }, 1200);
            };

            return (
                <div id="ui-root">
                    {isGeneratingPdf && (
                        <div className="fixed inset-0 z-[500] bg-slate-900/90 flex flex-col items-center justify-center text-white">
                            <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                            <h2 className="font-black uppercase tracking-widest text-sm text-center">Configurando Paginação ABNT v26<br/><span className="text-[10px] opacity-60 font-normal">Contando desde a Folha de Rosto...</span></h2>
                        </div>
                    )}

                    <div className="flex h-screen overflow-hidden">
                        <aside className="w-80 bg-slate-900 text-white flex flex-col shadow-2xl z-30">
                            <div className="p-6 bg-slate-950 border-b border-slate-800 flex items-center gap-3">
                                <div className="bg-blue-600 p-2 rounded-xl shadow-lg text-white">
                                    <i data-lucide="book-marked" className="w-5 h-5"></i>
                                </div>
                                <div><h1 className="font-black italic uppercase tracking-tighter text-lg leading-none">Lex ABNT</h1><p className="text-[8px] text-slate-500 font-bold uppercase mt-1">Rule v26</p></div>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto custom-scroll p-4 space-y-1">
                                <p className="text-[10px] font-black text-slate-600 uppercase tracking-widest mb-4 px-2">Estrutura</p>
                                {sections.map(s => {
                                    const firstPage = allPagesData.find(p => (p.id === s.id || p.sectionId === s.id) && p.isFirst);
                                    return (
                                        <button key={s.id} onClick={() => { setActiveSectionId(s.id); isTypingRef.current = false; }} className={`w-full text-left p-4 rounded-2xl text-[11px] font-bold uppercase transition-all flex justify-between items-center group ${activeSectionId === s.id ? 'bg-blue-600 text-white shadow-xl' : 'hover:bg-slate-800 text-slate-400'}`}>
                                            <span className="truncate">{s.title}</span>
                                            {firstPage?.pageNumber > 0 && <span className={`text-[9px] px-2 py-0.5 rounded-full ${activeSectionId === s.id ? 'bg-blue-500' : 'bg-slate-950'}`}>P.{firstPage.pageNumber}</span>}
                                        </button>
                                    );
                                })}
                            </div>
                        </aside>

                        <main className="flex-1 flex flex-col min-w-0 bg-slate-50">
                            <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shadow-sm z-20">
                                <div className="flex bg-slate-100 p-1 rounded-xl gap-1 border border-slate-200">
                                    <button onClick={() => setViewMode('edit')} className={`px-6 py-2 rounded-lg text-[10px] font-black tracking-widest transition-all ${viewMode === 'edit' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500'}`}>PREENCHER</button>
                                    <button onClick={() => setViewMode('preview')} className={`px-6 py-2 rounded-lg text-[10px] font-black tracking-widest transition-all ${viewMode === 'preview' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500'}`}>VER FOLHAS</button>
                                </div>
                                <div className="flex items-center gap-3">
                                    <button onClick={() => handleExportPdf(true)} className="bg-blue-600 text-white px-6 py-2.5 rounded-xl text-[10px] font-bold uppercase hover:bg-blue-700 shadow-lg flex items-center gap-2 active:scale-95"><i data-lucide="printer" className="w-4 h-4"></i> PDF COMPLETO</button>
                                </div>
                            </header>

                            <div className="flex-1 overflow-y-auto p-12 flex flex-col items-center custom-scroll">
                                {viewMode === 'edit' ? (
                                    <div className="w-full max-w-4xl flex flex-col bg-white rounded-[2rem] shadow-2xl border border-slate-200 overflow-hidden min-h-[80vh]">
                                        <div className="px-10 py-6 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                                            <h2 className="text-[13px] font-black text-slate-800 uppercase tracking-tight">{activeSection?.title}</h2>
                                        </div>
                                        
                                        <div className="p-16">
                                            {activeSection.type === 'cover' ? (
                                                <div className="grid grid-cols-2 gap-x-6">
                                                    <div className="col-span-2">
                                                        <label className="field-label">Instituição (Universidade)</label>
                                                        <input className="input-field" value={activeSection.data.university} onChange={e => handleDataChange('university', e.target.value)} />
                                                    </div>
                                                    <div className="col-span-2">
                                                        <label className="field-label">Faculdade / Curso</label>
                                                        <input className="input-field" value={activeSection.data.faculty} onChange={e => handleDataChange('faculty', e.target.value)} />
                                                    </div>

                                                    <div className="col-span-2 border-y border-slate-100 py-8 my-4">
                                                        <div className="flex items-center justify-between mb-6">
                                                            <h3 className="text-xs font-black text-slate-800 uppercase tracking-tight">Integrantes do Grupo</h3>
                                                            <button onClick={addAuthor} className="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase hover:bg-blue-100 transition-all flex items-center gap-2">
                                                                <i data-lucide="user-plus" className="w-3 h-3"></i> Adicionar Aluno
                                                            </button>
                                                        </div>
                                                        
                                                        {activeSection.data.authors.map((auth, idx) => (
                                                            <div key={idx} className="grid grid-cols-12 gap-4 items-end mb-4 animate-in fade-in slide-in-from-top-2">
                                                                <div className="col-span-6">
                                                                    <label className="text-[9px] text-slate-400 font-bold mb-1 block">Nome do Integrante {idx + 1}</label>
                                                                    <input className="input-field !mb-0" value={auth.name} onChange={e => handleAuthorUpdate(idx, 'name', e.target.value)} />
                                                                </div>
                                                                <div className="col-span-5">
                                                                    <label className="text-[9px] text-slate-400 font-bold mb-1 block">RA</label>
                                                                    <input className="input-field !mb-0 bg-blue-50/50" value={auth.ra} onChange={e => handleAuthorUpdate(idx, 'ra', e.target.value)} />
                                                                </div>
                                                                <div className="col-span-1 flex justify-center pb-1">
                                                                    <button onClick={() => removeAuthor(idx)} className="btn-ghost-red" title="Remover aluno">
                                                                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>

                                                    <div className="col-span-2">
                                                        <label className="field-label">Título do Trabalho</label>
                                                        <textarea className="input-field h-24 resize-none" value={activeSection.data.title} onChange={e => handleDataChange('title', e.target.value)} />
                                                    </div>
                                                    <div className="col-span-1">
                                                        <label className="field-label">Cidade</label>
                                                        <input className="input-field" value={activeSection.data.city} onChange={e => handleDataChange('city', e.target.value)} />
                                                    </div>
                                                    <div className="col-span-1">
                                                        <label className="field-label">Ano</label>
                                                        <input className="input-field" value={activeSection.data.year} onChange={e => handleDataChange('year', e.target.value)} />
                                                    </div>
                                                </div>
                                            ) : activeSection.type === 'title_page' ? (
                                                <div>
                                                    <label className="field-label">Natureza do Trabalho (Descrição)</label>
                                                    <textarea className="input-field h-32 resize-none" value={activeSection.data.description} onChange={e => handleDataChange('description', e.target.value)} />
                                                    
                                                    <label className="field-label">Orientador</label>
                                                    <input className="input-field" value={activeSection.data.advisor} onChange={e => handleDataChange('advisor', e.target.value)} />
                                                </div>
                                            ) : (
                                                <textarea 
                                                    className="w-full focus:outline-none resize-none text-[12pt] leading-[1.5] text-slate-800 min-h-[600px] selection:bg-blue-100" 
                                                    style={{ fontFamily: fontFamily }} 
                                                    value={localText} 
                                                    onChange={(e) => { isTypingRef.current = true; setLocalText(e.target.value); }} 
                                                />
                                            )}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="scale-90 origin-top pb-20">
                                        {allPagesData.filter(p => p.id === activeSectionId || p.sectionId === activeSectionId).map(p => <PageRenderer key={p.id} page={p} isPrint={false} />)}
                                    </div>
                                )}
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
