<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lex ABNT - Edição Local v22</title>
    
    <!-- Bibliotecas via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background-color: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }

        @media print {
            @page { size: A4; margin: 0; }
            html, body { background: white !important; height: auto !important; overflow: visible !important; }
            #root { display: none !important; }
            #print-container { display: block !important; width: 210mm !important; margin: 0 !important; background: white !important; }
            .abnt-page-print { 
                display: flex !important;
                flex-direction: column;
                width: 210mm !important;
                height: 297mm !important;
                padding: 3cm 2cm 2cm 3cm !important;
                box-sizing: border-box !important;
                background: white !important;
                position: relative !important;
                page-break-after: always !important;
                break-after: page !important;
                color: black !important;
                overflow: hidden !important;
            }
        }
        
        .abnt-page-screen {
            width: 21cm;
            min-height: 29.7cm;
            padding: 3cm 2cm 2cm 3cm;
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin: 20px auto;
            position: relative;
            box-sizing: border-box;
            color: black;
            display: flex;
            flex-direction: column;
        }

        .ai-pulse {
            animation: pulse-blue 2s infinite;
        }
        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body>
    <div id="print-container" style="display: none;"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const INITIAL_SECTIONS = [
            { id: 'sec_0', title: 'Capa', content: 'UNIVERSIDADE ANHANGUERA\nFACULDADE DE DIREITO\n\nRENATA BISPO CAMBUI\n\nPROJETO DE EXTENSÃO: INIMPUTABILIDADE PENAL E SAÚDE MENTAL\n\nSão Paulo\n2026', type: 'cover', order: 0 },
            { id: 'sec_1', title: 'Folha de Rosto', content: 'Monografia apresentada à Faculdade de Direito da Universidade Anhanguera como requisito para obtenção do grau de Bacharel em Direito.\n\nOrientador: Prof. Ms. Hamilton Gonçalves Ferraz', type: 'title_page', order: 1 },
            { id: 'sec_2', title: 'Sumário', content: 'INTRODUÇÃO\n1. DESENVOLVIMENTO\nCONCLUSÃO\nREFERÊNCIAS', type: 'pre-textual', order: 2 },
            { id: 'sec_3', title: 'Introdução', content: 'Inicie o seu texto aqui...', type: 'textual', order: 3 },
            { id: 'sec_4', title: 'Desenvolvimento', content: 'Conteúdo do trabalho...', type: 'textual', order: 4 },
            { id: 'sec_5', title: 'Conclusão', content: 'Considerações finais...', type: 'textual', order: 5 },
            { id: 'sec_6', title: 'Referências Bibliográficas', content: 'SOBRENOME, Nome. Título. Cidade: Editora, Ano.', type: 'references', order: 6 },
        ];

        function App() {
            // Carregar do localStorage ou usar o padrão
            const savedData = localStorage.getItem('lex_abnt_local_v22');
            const [sections, setSections] = useState(savedData ? JSON.parse(savedData) : INITIAL_SECTIONS);
            const [activeSectionId, setActiveSectionId] = useState(sections[0].id);
            const [viewMode, setViewMode] = useState('edit');
            const [syncStatus, setSyncStatus] = useState('synced');
            const [fontFamily, setFontFamily] = useState('Arial');
            const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);
            const [isAiProcessing, setIsAiProcessing] = useState(false);
            
            const activeSection = sections.find(s => s.id === activeSectionId);
            const [localText, setLocalText] = useState(activeSection?.content || '');
            const isTypingRef = useRef(false);
            const apiKey = ""; 

            useEffect(() => { if (window.lucide) lucide.createIcons(); });

            // Sincroniza localText quando muda de secção
            useEffect(() => {
                if (!isTypingRef.current) {
                    const current = sections.find(s => s.id === activeSectionId);
                    setLocalText(current?.content || '');
                }
            }, [activeSectionId]);

            // Guardar no localStorage automaticamente ao digitar
            useEffect(() => {
                if (!isTypingRef.current) return;
                
                setSyncStatus('syncing');
                const timer = setTimeout(() => {
                    const updatedSections = sections.map(s => 
                        s.id === activeSectionId ? { ...s, content: localText } : s
                    );
                    setSections(updatedSections);
                    localStorage.setItem('lex_abnt_local_v22', JSON.stringify(updatedSections));
                    setSyncStatus('synced');
                    isTypingRef.current = false;
                }, 500);

                return () => clearTimeout(timer);
            }, [localText]);

            // Motor de IA (Google Gemini) - Independente do Firebase
            const handlePdfUpload = async (e) => {
                const file = e.target.files[0];
                if (!file || file.type !== 'application/pdf') return;
                setIsAiProcessing(true);
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    const base64Data = reader.result.split(',')[1];
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: "Analisa este PDF. Extrai e distribui em: 'Capa', 'Introdução', 'Desenvolvimento', 'Conclusão' e 'Referências'. Devolve apenas JSON: {\"Capa\": \"...\", \"Introdução\": \"...\", ...}" },
                                        { inlineData: { mimeType: "application/pdf", data: base64Data } }
                                    ]
                                }],
                                generationConfig: { responseMimeType: "application/json" }
                            })
                        });
                        const result = await response.json();
                        const extracted = JSON.parse(result.candidates?.[0]?.content?.parts?.[0]?.text);
                        
                        const updated = sections.map(sec => {
                            if (sec.title === 'Capa' && extracted.Capa) return { ...sec, content: extracted.Capa };
                            if (sec.title === 'Introdução' && extracted.Introdução) return { ...sec, content: extracted.Introdução };
                            if (sec.title === 'Desenvolvimento' && extracted.Desenvolvimento) return { ...sec, content: extracted.Desenvolvimento };
                            if (sec.title === 'Conclusão' && extracted.Conclusão) return { ...sec, content: extracted.Conclusão };
                            if (sec.title.includes('Refer') && extracted['Referências']) return { ...sec, content: extracted['Referências'] };
                            return sec;
                        });
                        
                        setSections(updated);
                        localStorage.setItem('lex_abnt_local_v22', JSON.stringify(updated));
                        setLocalText(updated.find(s => s.id === activeSectionId).content);
                    } catch (err) { console.error(err); } finally { setIsAiProcessing(false); }
                };
            };

            const metadata = (() => {
                const cover = sections.find(s => s.type === 'cover');
                const text = (activeSectionId === cover?.id) ? localText : (cover?.content || '');
                const lines = text.split('\n').filter(l => l.trim() !== "");
                return {
                    institution: lines.slice(0, 2).join('\n'),
                    author: lines[2] || "AUTOR",
                    footer: lines.slice(-2).join('\n'),
                    title: lines.slice(3, -2).join('\n')
                };
            })();

            const allPagesData = (() => {
                let globalCounter = 0; let results = [];
                const titlePageIndex = sections.findIndex(s => s.type === 'title_page');
                sections.forEach((sec, idx) => {
                    const text = (sec.id === activeSectionId) ? localText : (sec.content || '');
                    const charsPerPage = 2100;
                    const pages = Math.max(1, Math.ceil(text.length / charsPerPage));
                    if (idx >= titlePageIndex) globalCounter++;
                    for (let p = 0; p < pages; p++) {
                        results.push({
                            id: `${sec.id}-${p}`, sectionId: sec.id, type: sec.type, title: sec.title,
                            content: text.substring(p * charsPerPage, (p + 1) * charsPerPage),
                            pageNumber: globalCounter,
                            showNumber: (sec.type === 'textual' || sec.type === 'references'),
                            isFirst: p === 0
                        });
                        if (p < pages - 1 && idx >= titlePageIndex) globalCounter++;
                    }
                });
                return results;
            })();

            const handleExportWord = () => {
                const header = `<html><head><meta charset='utf-8'><style>body { font-family: ${fontFamily}; font-size: 12pt; line-height: 1.5; } h2 { text-align: center; text-transform: uppercase; margin-bottom: 24pt; } p { text-align: justify; margin-bottom: 12pt; text-indent: 1.25cm; } .center { text-align: center; text-transform: uppercase; font-weight: bold; } .page-break { page-break-after: always; }</style></head><body>`;
                let bodyContent = "";
                sections.forEach(sec => {
                    const text = (sec.id === activeSectionId) ? localText : (sec.content || '');
                    if (sec.type === 'cover' || sec.type === 'title_page') {
                        bodyContent += `<div class='page-break center'><div style='margin-bottom: 50pt'>${metadata.institution}</div><div style='margin-bottom: 50pt'>${metadata.author}</div><div style='margin: 100pt 0; font-size: 14pt'>${metadata.title}</div><div style='margin-top: 100pt'>${metadata.footer}</div></div>`;
                    } else {
                        bodyContent += `<div class='page-break'><h2>${sec.title}</h2>${text.split('\n').map(l => `<p>${l}</p>`).join('')}</div>`;
                    }
                });
                const blob = new Blob(['\ufeff', header + bodyContent + "</body></html>"], { type: 'application/msword' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `Trabalho_ABNT.doc`;
                link.click();
            };

            const PageRenderer = ({ page, isPrint = false }) => {
                const style = { fontFamily: fontFamily === 'Arial' ? 'Arial, sans-serif' : '"Times New Roman", serif', fontSize: '12pt', lineHeight: '1.5' };
                if (page.type === 'cover' || page.type === 'title_page') {
                    return (
                        <div className={isPrint ? 'abnt-page-print' : 'abnt-page-screen'} style={style}>
                            <div className="flex flex-col h-full text-center uppercase font-bold justify-between py-2">
                                <div className="space-y-6">
                                    {page.type === 'cover' && <div className="whitespace-pre-line">{metadata.institution}</div>}
                                    <div className={page.type === 'cover' ? "mt-12" : "mt-6"}>{metadata.author}</div>
                                </div>
                                <div className="flex-1 flex flex-col justify-center">
                                    <div className="text-xl px-4 whitespace-pre-line">{metadata.title}</div>
                                    {page.type === 'title_page' && <div className="mt-10 text-justify lowercase font-normal normal-case text-[10pt] leading-relaxed" style={{ marginLeft: '45%', textTransform: 'none' }}>{page.content}</div>}
                                </div>
                                <div className="mt-auto whitespace-pre-line">{metadata.footer}</div>
                            </div>
                        </div>
                    );
                }
                return (
                    <div className={isPrint ? 'abnt-page-print' : 'abnt-page-screen'} style={style}>
                        {page.showNumber && <div className="absolute top-[2cm] right-[2cm] font-normal text-sm">{page.pageNumber}</div>}
                        <div className="w-full">
                            {page.isFirst && <h2 className="text-center font-bold uppercase mb-12">{page.title}</h2>}
                            <div className="whitespace-pre-wrap text-justify">
                                {page.content.split('\n').map((l, i) => <p key={i} className="mb-4" style={{ textIndent: (page.type === 'references' || l.trim() === "") ? '0' : '1.25cm' }}>{l}</p>)}
                            </div>
                        </div>
                    </div>
                );
            };

            const handleExportPdf = (all) => {
                setIsGeneratingPdf(true);
                const portal = document.getElementById('print-container');
                portal.innerHTML = '';
                const pages = all ? allPagesData : allPagesData.filter(p => p.sectionId === activeSectionId);
                pages.forEach(p => {
                    const root = document.createElement('div');
                    portal.appendChild(root);
                    ReactDOM.createRoot(root).render(<PageRenderer page={p} isPrint={true} />);
                });
                setTimeout(() => { setIsGeneratingPdf(false); window.print(); }, 1000);
            };

            return (
                <div id="ui-root">
                    {isGeneratingPdf && (
                        <div className="fixed inset-0 z-[500] bg-slate-900/90 flex flex-col items-center justify-center text-white">
                            <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                            <h2 className="font-black uppercase tracking-widest text-sm">Gerando PDF</h2>
                        </div>
                    )}

                    <div className="flex h-screen overflow-hidden">
                        <aside className="w-80 bg-slate-900 text-white flex flex-col shadow-2xl z-30">
                            <div className="p-6 bg-slate-950 border-b border-slate-800 flex items-center gap-3">
                                <div className="bg-blue-600 p-2 rounded-xl"><i data-lucide="file-text" className="w-5 h-5"></i></div>
                                <div><h1 className="font-black italic uppercase tracking-tighter text-lg leading-none">Lex ABNT</h1><p className="text-[8px] text-slate-500 font-bold uppercase mt-1">Standalone v22</p></div>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto custom-scroll p-4 space-y-6">
                                <div>
                                    <p className="text-[10px] font-black text-slate-600 uppercase tracking-widest mb-4 px-2">Estrutura</p>
                                    <div className="space-y-1">
                                        {sections.map(s => {
                                            const firstPage = allPagesData.find(p => p.sectionId === s.id && p.isFirst);
                                            return (
                                                <button key={s.id} onClick={() => { setActiveSectionId(s.id); isTypingRef.current = false; }} className={`w-full text-left p-4 rounded-2xl text-[11px] font-bold uppercase transition-all flex justify-between items-center group ${activeSectionId === s.id ? 'bg-blue-600 text-white shadow-xl' : 'hover:bg-slate-800 text-slate-400'}`}>
                                                    <span className="truncate">{s.title}</span>
                                                    {firstPage?.pageNumber > 0 && <span className={`text-[9px] px-2 py-0.5 rounded-full ${activeSectionId === s.id ? 'bg-blue-500' : 'bg-slate-950'}`}>P.{firstPage.pageNumber}</span>}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="pt-6 border-t border-slate-800">
                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 px-2">IA de Importação</p>
                                    <label className={`w-full flex items-center justify-center gap-3 p-4 rounded-2xl border-2 border-dashed transition-all cursor-pointer ${isAiProcessing ? 'border-blue-500 bg-blue-900/20 ai-pulse' : 'border-slate-700 hover:border-blue-600 hover:bg-slate-800'}`}>
                                        <div className="flex flex-col items-center gap-2">
                                            <i data-lucide={isAiProcessing ? "rotate-cw" : "file-up"} className={`w-5 h-5 ${isAiProcessing ? 'animate-spin text-blue-500' : 'text-slate-400'}`}></i>
                                            <span className="text-[9px] font-black text-slate-400 uppercase">{isAiProcessing ? "Analisando..." : "Subir PDF"}</span>
                                        </div>
                                        <input type="file" className="hidden" accept=".pdf" onChange={handlePdfUpload} disabled={isAiProcessing} />
                                    </label>
                                </div>
                            </div>

                            <div className="p-4 bg-slate-950 border-t border-slate-800 text-center">
                                <p className="text-[9px] font-bold text-slate-600 uppercase">Armazenamento Local Ativo</p>
                                <button onClick={() => { if(confirm("Apagar tudo?")) { localStorage.clear(); location.reload(); }}} className="mt-2 text-[8px] text-red-500 hover:text-red-400 font-bold uppercase tracking-widest">Limpar Base de Dados</button>
                            </div>
                        </aside>

                        <main className="flex-1 flex flex-col min-w-0 bg-slate-50">
                            <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shadow-sm z-20">
                                <div className="flex bg-slate-100 p-1 rounded-xl gap-1 border border-slate-200">
                                    <button onClick={() => setViewMode('edit')} className={`px-6 py-2 rounded-lg text-[10px] font-black tracking-widest transition-all ${viewMode === 'edit' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500'}`}>EDITAR</button>
                                    <button onClick={() => setViewMode('preview')} className={`px-6 py-2 rounded-lg text-[10px] font-black tracking-widest transition-all ${viewMode === 'preview' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500'}`}>VISUALIZAR</button>
                                </div>
                                <div className="flex items-center gap-3">
                                    <div className={`flex items-center gap-2 px-3 py-1.5 rounded-full border ${syncStatus === 'syncing' ? 'bg-orange-50 text-orange-600 border-orange-200' : 'bg-blue-50 text-blue-600 border-blue-200'} text-[9px] font-black uppercase`}>
                                        <i data-lucide={syncStatus === 'syncing' ? "rotate-cw" : "save"} className={`w-3 h-3 ${syncStatus === 'syncing' ? 'animate-spin' : ''}`}></i>
                                        <span>{syncStatus === 'syncing' ? 'A Salvar...' : 'Salvo no PC'}</span>
                                    </div>
                                    <button onClick={handleExportWord} className="bg-emerald-600 text-white px-4 py-2.5 rounded-xl text-[10px] font-bold uppercase hover:bg-emerald-700 flex items-center gap-2 shadow-md"><i data-lucide="file-text" className="w-4 h-4"></i> WORD</button>
                                    <button onClick={() => handleExportPdf(true)} className="bg-blue-600 text-white px-4 py-2.5 rounded-xl text-[10px] font-bold uppercase hover:bg-blue-700 shadow-lg flex items-center gap-2 active:scale-95"><i data-lucide="file-check" className="w-4 h-4"></i> PDF</button>
                                </div>
                            </header>

                            <div className="flex-1 overflow-y-auto p-12 flex flex-col items-center custom-scroll">
                                {viewMode === 'edit' ? (
                                    <div className="w-full max-w-4xl flex flex-col bg-white rounded-[2rem] shadow-2xl border border-slate-200 overflow-hidden min-h-[80vh]">
                                        <div className="px-10 py-6 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                                            <h2 className="text-[13px] font-black text-slate-800 uppercase tracking-tight">{activeSection?.title}</h2>
                                            <select value={fontFamily} onChange={e => setFontFamily(e.target.value)} className="text-[10px] font-black bg-white border border-slate-200 rounded-lg px-4 py-2 shadow-sm outline-none">
                                                <option value="Arial">ARIAL (PADRÃO)</option>
                                                <option value="Times New Roman">TIMES NEW ROMAN</option>
                                            </select>
                                        </div>
                                        <textarea className="flex-1 p-16 focus:outline-none resize-none text-[12pt] leading-[1.5] text-slate-800 min-h-[700px] selection:bg-blue-100" style={{ fontFamily: fontFamily }} value={localText} onChange={(e) => { isTypingRef.current = true; setLocalText(e.target.value); }} />
                                    </div>
                                ) : (
                                    <div className="scale-90 origin-top pb-20">
                                        {allPagesData.filter(p => p.sectionId === activeSectionId).map(p => <PageRenderer key={p.id} page={p} isPrint={false} />)}
                                    </div>
                                )}
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
